# Continuous delivery for the three-tier application.
#
#   test     unit tests for both services; CI-to-AWS login check   (all branches)
#   plan     terraform plan with the read-only plan role           (all branches)
#   build    linux/amd64 images pushed to ECR, tagged by commit    (main)
#   release  one serialized job: API then web, verified, auto-rollback (main)
#   infra    apply the reviewed plan                                (main, manual)
#
# AWS access: this GitLab server issues no ID tokens, so jobs assume scoped
# roles with CI user keys from masked variables (PLAN_* on every branch,
# DEPLOY_* protected: main only). See scripts/ci/aws-login.sh.
#
# Runner requirement for build jobs: the Docker socket is mounted, e.g. in
# config.toml [runners.docker] volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"].

# Pipelines run only in the working project (example-user/three-tier). The
# submission repository receives the final solution but has no runners, so no
# pipeline is created there.
workflow:
  rules:
    - if: $CI_PROJECT_PATH == "example-org/submission-repo"
      when: never
    # A branch with an open merge request runs only the merge-request pipeline,
    # not a duplicate branch pipeline.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

# The runner's network is unreliable: retry infrastructure failures (never
# script failures, so failing tests still fail the pipeline).
default:
  # Fail a stuck job after 30 minutes instead of GitLab's default hour.
  timeout: 30m
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure, scheduler_failure, unknown_failure]

stages:
  - test
  - plan
  - build
  - release
  - infra

variables:
  GET_SOURCES_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"
  RESTORE_CACHE_ATTEMPTS: "3"
  # Job checkouts over HTTP/1.1 (avoids HTTP/2 framing errors on this network),
  # and abort a transfer slower than 1 KB/s for 60 s, so GET_SOURCES_ATTEMPTS
  # retries it instead of the job hanging until its timeout.
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
  GIT_CONFIG_KEY_1: http.lowSpeedLimit
  GIT_CONFIG_VALUE_1: "1000"
  GIT_CONFIG_KEY_2: http.lowSpeedTime
  GIT_CONFIG_VALUE_2: "60"
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "123456789012"
  AWS_PLAN_ROLE_ARN: arn:aws:iam::123456789012:role/three-tier-ci-plan
  REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: three-tier
  PUBLIC_URL: https://dxxxxxxxxxxxxx.cloudfront.net
  TF_STATE_BUCKET: three-tier-tfstate-123456789012-us-east-1
  NODE_IMAGE: node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
  AWS_CLI_IMAGE: amazon/aws-cli:2.37.7@sha256:95f8d1e6d31aaa16997d1406eb532b0ca6a9830fe8a859c37a0fd223f10959e5
  TERRAFORM_IMAGE: hashicorp/terraform:1.16.4
  DOCKER_IMAGE: docker:28.4.0-cli@sha256:6a73c9433f2ba4279815be1e60f5739288b939dda1e48151d8c393537802de37

# ---------------------------------------------------------------- test
.unit_test:
  stage: test
  image: $NODE_IMAGE
  # The TLS tests generate throwaway certificates with the openssl CLI,
  # which the slim Node image does not include.
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl >/dev/null
    - openssl version
  script:
    - node --version && npm --version
    - cd "$SERVICE"
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm ls --omit=dev --all >/dev/null
    - npm test
  cache:
    key: npm-$SERVICE
    paths: [.npm-cache/]

test:api:
  extends: .unit_test
  variables:
    SERVICE: api
    npm_config_cache: $CI_PROJECT_DIR/.npm-cache

test:web:
  extends: .unit_test
  variables:
    SERVICE: web
    npm_config_cache: $CI_PROJECT_DIR/.npm-cache

aws-identity:
  stage: test
  image:
    name: $AWS_CLI_IMAGE
    entrypoint: [""]
  # Used if the GitLab server issues ID tokens; otherwise aws-login falls
  # back to the scoped CI user key stored as a masked CI/CD variable.
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  script:
    - echo "server=${CI_SERVER_VERSION:-unknown} project=${CI_PROJECT_PATH} ref=${CI_COMMIT_REF_NAME}"
    # Names (never values) of user-defined variables this job received.
    - echo "user-defined variables:" $(env | cut -d= -f1 | grep -E '^(PLAN|DEPLOY)_' | sort)
    - . scripts/ci/aws-login.sh plan
    # A dry run always exits non-zero, so capture the output before inspecting
    # it (job shells use pipefail). Expected code: UnauthorizedOperation.
    - result=$(aws ec2 create-vpc --cidr-block 10.99.0.0/16 --dry-run 2>&1 || true)
    - code=$(printf '%s' "$result" | sed -n 's/.*An error occurred (\([A-Za-z]*\)).*/\1/p' | head -1)
    - echo "create-vpc dry run -> ${code:-no error code}"
    - test "$code" = UnauthorizedOperation && echo "write refused as expected"

# ---------------------------------------------------------------- plan
# Terraform's AWS SDK assumes the role itself from a shared config profile,
# so the Terraform image needs no AWS CLI.
.terraform:
  image:
    name: $TERRAFORM_IMAGE
    entrypoint: [""]
  before_script:
    - |
      case "$TF_ROLE" in
        plan) KEY_ID="${PLAN_AWS_ACCESS_KEY_ID:-}"; SECRET="${PLAN_AWS_SECRET_ACCESS_KEY:-}" ;;
        infra) KEY_ID="${DEPLOY_AWS_ACCESS_KEY_ID:-}"; SECRET="${DEPLOY_AWS_SECRET_ACCESS_KEY:-}" ;;
      esac
      if [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then echo "CI keys for role $TF_ROLE are not available to this job"; exit 1; fi
      mkdir -p ~/.aws
      printf '[ci-user]\naws_access_key_id = %s\naws_secret_access_key = %s\n' "$KEY_ID" "$SECRET" > ~/.aws/credentials
      printf '[profile ci]\nrole_arn = arn:aws:iam::%s:role/three-tier-ci-%s\nsource_profile = ci-user\nrole_session_name = gitlab-%s-%s\nregion = %s\n' \
        "$AWS_ACCOUNT_ID" "$TF_ROLE" "$CI_PIPELINE_ID" "$CI_JOB_ID" "$AWS_REGION" > ~/.aws/config
      chmod 600 ~/.aws/credentials ~/.aws/config
      unset PLAN_AWS_ACCESS_KEY_ID PLAN_AWS_SECRET_ACCESS_KEY DEPLOY_AWS_ACCESS_KEY_ID DEPLOY_AWS_SECRET_ACCESS_KEY KEY_ID SECRET
    - export AWS_PROFILE=ci TF_IN_AUTOMATION=1 TF_PLUGIN_CACHE_DIR="$CI_PROJECT_DIR/.terraform-plugins"
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - cd infra/stack
    # The provider download is large; retry transient network failures.
    - |
      for attempt in 1 2 3; do
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=stack/terraform.tfstate" \
          -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true" && break
        [ "$attempt" = 3 ] && exit 1
        echo "terraform init failed (attempt $attempt); retrying in 15 s"; sleep 15
      done
  after_script:
    - rm -rf ~/.aws
  # Keep downloaded providers even if a later step fails.
  cache:
    key: terraform-plugins
    paths: [.terraform-plugins/]
    when: always

terraform:plan:
  extends: .terraform
  stage: plan
  needs: []
  variables:
    TF_ROLE: plan
  script:
    - terraform fmt -check -recursive ..
    - terraform validate
    - rc=0; terraform plan -input=false -lock-timeout=120s -detailed-exitcode -out=stack.tfplan || rc=$?
    - echo "plan exit=$rc (0 = no changes, 2 = changes to review)"
    - test "$rc" != 1
  # No artifacts: this GitLab server rejects artifact uploads (HTTP 500), and
  # plan files can contain sensitive values anyway. The plan is in the job log.

# ---------------------------------------------------------------- build
.build_image:
  stage: build
  image: $DOCKER_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache aws-cli bash >/dev/null
  script:
    - . scripts/ci/aws-login.sh release
    - aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
    - repository="$REGISTRY/three-tier/$SERVICE"
    - tag="$CI_COMMIT_SHORT_SHA"
    - |
      if aws ecr describe-images --repository-name "three-tier/$SERVICE" --image-ids imageTag="$tag" >/dev/null 2>&1; then
        echo "$tag already pushed (tags are immutable); reusing it"
      else
        docker buildx build --platform linux/amd64 --provenance=false --push -t "$repository:$tag" "$SERVICE"
      fi
    - digest=$(aws ecr describe-images --repository-name "three-tier/$SERVICE" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)
    - echo "pushed $repository@$digest"

build:api:
  extends: .build_image
  needs: ["test:api"]
  variables:
    SERVICE: api

build:web:
  extends: .build_image
  needs: ["test:web"]
  variables:
    SERVICE: web

# ---------------------------------------------------------------- release
# One job releases API then web (web readiness depends on the API), under a
# single production lock, so releases of different pipelines never interleave.
# It runs only after every check: both unit-test jobs, the CI login check, a
# successful terraform plan, and both image builds.
release:production:
  stage: release
  image:
    name: $AWS_CLI_IMAGE
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: ["test:api", "test:web", "aws-identity", "terraform:plan", "build:api", "build:web"]
  resource_group: production
  script:
    - . scripts/ci/aws-login.sh release
    - echo "releasing commit $CI_COMMIT_SHA"
    # Digests come from ECR by the commit tag (immutable), not from artifacts.
    - |
      for service in api web; do
        digest=$(aws ecr describe-images --repository-name "three-tier/$service" --image-ids imageTag="$CI_COMMIT_SHORT_SHA" --query 'imageDetails[0].imageDigest' --output text)
        bash scripts/release/deploy.sh "$service" "$REGISTRY/three-tier/$service@$digest"
      done

# ---------------------------------------------------------------- infra
infra:apply:
  extends: .terraform
  stage: infra
  needs: ["terraform:plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  resource_group: production
  variables:
    TF_ROLE: infra
  # Manual job: the plan it prints is the plan it applies.
  script:
    - terraform plan -input=false -lock-timeout=120s -out=stack.tfplan
    - terraform apply -input=false -lock-timeout=120s stack.tfplan
